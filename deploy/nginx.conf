server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  absolute_redirect off;
  port_in_redirect off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Cache-Control "no-cache" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

  # Retired URLs. The three live workshop pages stay on their own addresses.
  location ~ ^/(produktai|virtualus-operatorius)/?$ { return 301 /sprendimai/; }
  location ~ ^/(naujienos|es-projektas|dipa-konferencija-2025)/?$ { return 301 /; }
  location ~ ^/di-mokymai/?$ { return 301 /ai-produktyvumo-programa/; }
  location ~ ^/di-mokymai/(di-dirbtuviu-programos|mini-di-dirbtuves|va-kurimo-dirbtuves|di-ciklas-imonems|di-startas-verslui)/?$ {
    return 301 /ai-produktyvumo-programa/;
  }
  location ~ ^/di-mokymai/didziosios-di-dirbtuves/?$ { return 301 /di-mokymai/di-dirbtuves-komandoms/; }

  location / {
    try_files $uri $uri/ =404;
  }
}
